services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: acmecommerce
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acmecommerce"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__AcmeCommerce: Host=postgres;Database=acmecommerce;Username=acme;Password=${POSTGRES_PASSWORD};Timeout=5;Command Timeout=5
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.Mcp
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Jwt__Issuer: ${JWT_ISSUER:-acmecommerce-dev}
      Jwt__Audience: ${JWT_AUDIENCE:-acmecommerce-mcp}
      Jwt__SigningKeyBase64: ${JWT_SIGNING_KEY_BASE64:?Run python3 scripts/dev_token.py --init-key first}
    ports:
      - "127.0.0.1:5081:8080"
volumes:
  postgres-data:
