name: Build and smoke tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AcmeCommerce.slnx
      - run: dotnet build AcmeCommerce.slnx -c Release --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test -- --no-watch --no-progress
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start local demo
        run: |
          cp .env.example .env
          python3 scripts/dev_token.py --init-key
          docker compose up --build -d
      - run: python3 tests/smoke.py
      - run: ACME_ENV_FILE=.env python3 tests/auth_smoke.py
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop isolated CI stack
        if: always()
        run: docker compose down

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jhoneeleoterio/mcp-secure-api-demo-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.Mcp
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jhoneeleoterio/mcp-secure-api-demo-mcp:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.Web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jhoneeleoterio/mcp-secure-api-demo-web:${{ github.sha }}
